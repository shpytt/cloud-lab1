name: Deploy to AWS

# Автозапуск на push у main вимкнено: роль OIDC не створена,
# бо SCP акаунта забороняє iam:CreateOpenIDConnectProvider (див. README).
on:
  workflow_dispatch:

permissions:
  id-token: write # дозвіл отримати OIDC-токен
  contents: read

env:
  AWS_REGION: eu-north-1
  AWS_ROLE_ARN: arn:aws:iam::325013946468:role/cloud-lab1-github-actions
  ECR_REPOSITORY: cloud-lab1
  ECS_CLUSTER: cloud-lab1
  ECS_SERVICE: cloud-lab1-service
  TASK_FAMILY: cloud-lab1
  CONTAINER_NAME: api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Image tag = short commit hash
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: 3. Log in to AWS via OIDC (no access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 4. Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 5. Build and push image
        id: build
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: 6. Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: 7. Put new image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      - name: 8. Deploy to ECS and wait until healthy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true